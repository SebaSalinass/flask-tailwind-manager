[tox]
min_version = 4.30.2
env_list = py{310,311,312,313,314}-flask{2,3}

[testenv]
description = Test the wheel on Python {base_python} with {env_name}
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=8.4.2
    flask2: Flask>=2.2,<3
    flask2: Werkzeug<3
    flask3: Flask>=3,<4
commands = python -m pytest -v -o pythonpath= {posargs}
